spring.application.name=school
#server.port=8080

   # Профиль по умолчанию
spring.profiles.active=productionProfile
# или запуск через терминал java -jar school-0.0.1-SNAPSHOT.jar --spring.profiles.active=productionProfile

spring.datasource.url=jdbc:postgresql://localhost:5432/hogwarts
spring.datasource.username=student
spring.datasource.password=chocolatefrog
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.change-log=classpath:liquibase/index-practice.yml

avatars.dir.path=avatars

# spring.servlet.multipart.max-file-size=10MB макс вес файла
# spring.servlet.multipart.max-request-size=10MB макс вес запроса
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=validate
# Hibernate ddl-auto=update используют на самых первых этапах разработки. Он проверяет и создает таблицы на основе Java-классов (@Entity) и не предназначен для изменения структуры БД на живом сервере

logging.level.root=INFO